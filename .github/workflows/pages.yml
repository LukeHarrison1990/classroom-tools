# Publishes the website in site/ to GitHub Pages whenever it, the screenshots
# or the branding change on main. One-time setup: Settings > Pages > Source:
# "GitHub Actions".
name: website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "docs/social-preview.png", "assets/branding/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: sh site/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
