# Builds and tests Classroom Toolkit on every push and pull request.
# Pushing a tag such as v1.2.0 also publishes a GitHub release: the zip is
# attached and the notes are that version's section of CHANGELOG.md.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases from tags

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat release

      - name: Test
        shell: cmd
        timeout-minutes: 5
        run: build.bat test

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomToolkit
          path: release/*.zip

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          built=$(sed -n 's/.*AssemblyInformationalVersion("\([^"]*\)").*/\1/p' src/Program.cs)
          if [ "$version" != "$built" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in src/Program.cs ($built)."
            exit 1
          fi
          awk -v v="$version" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          sed "s/\${VERSION}/$version/g" .github/release-footer.md >> notes.md
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Classroom Toolkit ${{ env.version }}
          body_path: notes.md
          files: release/*.zip
