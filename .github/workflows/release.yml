# Builds Classroom Toolkit on every push and pull request.
# Pushing a tag such as v1.0.0 also publishes a GitHub release with the zip attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework compiler
        shell: cmd
        run: build.bat release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomToolkit
          path: release/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          body_path: docs/RELEASE_NOTES.md
