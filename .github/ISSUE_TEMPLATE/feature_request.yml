name: Feature request
description: Suggest a new tool or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with in the classroom?
      description: The lesson moment, routine or problem you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Classroom Toolkit to do?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, examples or similar tools you've used.
